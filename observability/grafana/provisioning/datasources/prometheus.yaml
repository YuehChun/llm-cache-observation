apiVersion: 1

datasources:
  - name: Prometheus
    uid: prom-default
    type: prometheus
    access: proxy
    # Prometheus runs in minikube; reachable from this host container via
    # host.docker.internal once `kubectl port-forward svc/prometheus -n monitoring 9090:9090` is running.
    url: http://host.docker.internal:9090
    isDefault: true
    editable: false
