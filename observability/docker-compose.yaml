services:
  # Grafana stays on host. Prometheus has been moved into minikube
  # (see manifests/monitoring/) so it can scrape Kubernetes infrastructure
  # (cAdvisor, kubelet, pods with prometheus.io/scrape annotation) from
  # inside the cluster.
  #
  # Grafana reaches Prometheus via host.docker.internal:9090, which is
  # provided by `kubectl port-forward svc/prometheus -n monitoring 9090:9090`
  # (see scripts/start-prometheus-tunnel.sh).
  grafana:
    image: grafana/grafana:11.6.0
    container_name: llm-cache-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-data:
